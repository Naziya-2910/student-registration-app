services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: student_db
    volumes:
      - student-mysql-data:/var/lib/mysql

  backend:
    build: ./back-end
    container_name: student-backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  frontend:
    build: ./front-end
    container_name: student-frontend
    ports:
      - "5500:80"
    depends_on:
      - backend

volumes:
  student-mysql-data:
    external: true